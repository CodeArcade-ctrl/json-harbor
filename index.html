<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><meta name="description" content="Format, validate, and minify JSON in your browser. Your data stays on your device."><title>JSON Harbor</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#18243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 20px 60px}header,.toolbar,.stats{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:22px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0}.eyebrow{font-size:.78rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:#3b68ad}p{color:#627087}.toolbar{justify-content:flex-start;flex-wrap:wrap;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;border:1px solid #dfe5ef;border-radius:16px;padding:16px}.panel h2{font-size:1rem;margin:0 0 10px}.panel-head{display:flex;justify-content:space-between;align-items:center}.count{font-size:.8rem;color:#6b7588}textarea{display:block;width:100%;min-height:390px;resize:vertical;border:1px solid #d8dfeb;border-radius:10px;padding:14px;font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#1e2b43;background:#fbfcfe}button{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:#294887;color:white;font-weight:700;cursor:pointer}button.secondary{color:#29416c;background:#e8edf6}button:focus-visible,textarea:focus-visible{outline:3px solid #efa943;outline-offset:2px}.stats{justify-content:flex-start;min-height:34px;font-size:.9rem}.good{color:#147347}.bad{color:#a43232}.privacy{margin-top:16px;padding:12px 14px;background:#edf5ee;border-radius:10px;color:#24543a;font-size:.9rem}.error{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:22px 14px}textarea{min-height:280px}header{align-items:flex-start}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">JSON, without the fuss</div><h1>JSON Harbor</h1><p id="intro">Format, validate, or shrink JSON — right here in your browser.</p></div><button class="secondary" id="lang" type="button">Nederlands</button></header>
<div class="toolbar"><button id="format" type="button">Format JSON</button><button class="secondary" id="minify" type="button">Minify</button><button class="secondary" id="sample" type="button">Load sample</button><button class="secondary" id="clear" type="button">Clear</button></div>
<div class="grid"><section class="panel"><div class="panel-head"><h2 id="inputLabel">Input</h2><span class="count" id="inCount">0 chars</span></div><textarea id="input" spellcheck="false" aria-label="JSON input" placeholder='{"hello":"world"}'></textarea></section>
<section class="panel"><div class="panel-head"><h2 id="outputLabel">Output</h2><span class="count" id="outCount">0 chars</span></div><textarea id="output" spellcheck="false" aria-label="Formatted JSON output" readonly></textarea></section></div>
<div class="stats" id="status" role="status" aria-live="polite"></div><div class="toolbar"><button class="secondary" id="copy" type="button">Copy output</button><button class="secondary" id="download" type="button">Download .json</button></div>
<div class="privacy" id="privacy">Private by default: your JSON is processed locally and never sent to a server.</div></main>
<script>
const $=id=>document.getElementById(id);let nl=false;
const sample='{\n  "project": "Harbor",\n  "active": true,\n  "items": [\n    {"id": 1, "name": "First"},\n    {"id": 2, "name": "Second"}\n  ]\n}';
function count(){ $('inCount').textContent=$('input').value.length+(nl?' tekens':' chars');$('outCount').textContent=$('output').value.length+(nl?' tekens':' chars')}
function show(message,kind=''){ $('status').textContent=message;$('status').className='stats '+kind }
function process(compact){const raw=$('input').value;if(!raw.trim()){show(nl?'Plak eerst JSON in het invoerveld.':'Paste some JSON into the input first.','bad');$('output').value='';count();return}
try{const value=JSON.parse(raw);$('output').value=JSON.stringify(value,null,compact?undefined:2);show(nl?'Geldige JSON.':'Valid JSON.','good')}catch(e){$('output').value='';show((nl?'Ongeldige JSON: ':'Invalid JSON: ')+e.message,'bad')}count()}
$('format').onclick=()=>process(false);$('minify').onclick=()=>process(true);$('sample').onclick=()=>{$('input').value=sample;process(false)};$('clear').onclick=()=>{$('input').value='';$('output').value='';show('');count();$('input').focus()};
$('copy').onclick=async()=>{if(!$('output').value){show(nl?'Geen uitvoer om te kopiëren.':'Nothing to copy yet.','bad');return}try{await navigator.clipboard.writeText($('output').value);show(nl?'Uitvoer gekopieerd.':'Output copied.','good')}catch{show(nl?'Kopiëren is niet beschikbaar. Selecteer de uitvoer handmatig.':'Clipboard access unavailable. Select the output and copy it manually.','bad')}};
$('download').onclick=()=>{if(!$('output').value){show(nl?'Geen uitvoer om te downloaden.':'Nothing to download yet.','bad');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').value],{type:'application/json'}));a.download='formatted.json';a.click();URL.revokeObjectURL(a.href);show(nl?'Download gestart.':'Download started.','good')};
$('input').addEventListener('input',count);$('lang').onclick=()=>{nl=!nl;document.documentElement.lang=nl?'nl':'en';$('lang').textContent=nl?'English':'Nederlands';$('intro').textContent=nl?'Formatteer, controleer of verklein JSON — direct in je browser.':'Format, validate, or shrink JSON — right here in your browser.';$('format').textContent=nl?'JSON formatteren':'Format JSON';$('minify').textContent=nl?'Verkleinen':'Minify';$('sample').textContent=nl?'Voorbeeld laden':'Load sample';$('clear').textContent=nl?'Wissen':'Clear';$('inputLabel').textContent=nl?'Invoer':'Input';$('outputLabel').textContent=nl?'Uitvoer':'Output';$('copy').textContent=nl?'Uitvoer kopiëren':'Copy output';$('download').textContent=nl?'Downloaden als .json':'Download .json';$('privacy').textContent=nl?'Standaard privé: je JSON wordt lokaal verwerkt en nooit naar een server gestuurd.':'Private by default: your JSON is processed locally and never sent to a server.';count()};
count();
</script></body></html>
